services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: vanguard
      POSTGRES_PASSWORD: vanguard
      POSTGRES_DB: vanguard
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vanguard"]
      interval: 5s
      timeout: 3s
      retries: 10

  mailhog:
    image: mailhog/mailhog
    ports:
      - "1025:1025" # SMTP
      - "8025:8025" # web UI

  app:
    image: node:22-bookworm-slim
    working_dir: /app
    command: sh -c "npm ci && npx playwright install --with-deps chromium && npx prisma migrate deploy && npm run dev"
    environment:
      DATABASE_URL: postgresql://vanguard:vanguard@postgres:5432/vanguard
      BETTER_AUTH_SECRET: dev-secret-change-me
      BETTER_AUTH_URL: http://localhost:3000
      SMTP_URL: smtp://mailhog:1025
      MAIL_FROM: "Vanguard <noreply@vanguard.local>"
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      # keep container's node_modules separate from host's
      - app_node_modules:/app/node_modules
    depends_on:
      postgres:
        condition: service_healthy

  worker:
    image: node:22-bookworm-slim
    working_dir: /app
    command: sh -c "npm ci && npx playwright install --with-deps chromium && npx prisma migrate deploy && npm run worker"
    environment:
      DATABASE_URL: postgresql://vanguard:vanguard@postgres:5432/vanguard
    volumes:
      - .:/app
      - worker_node_modules:/app/node_modules
      # PDFs and evidence must survive container restarts
      - storage_data:/app/storage
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
  app_node_modules:
  worker_node_modules:
  storage_data:
